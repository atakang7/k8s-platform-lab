apiVersion: v1
kind: Pod
metadata:
  labels:
    component: jenkins-agent
spec:
  serviceAccountName: jenkins-agent
  restartPolicy: Never
  nodeSelector:
    kubernetes.io/hostname: node-3
  imagePullSecrets:
    - name: dockerhub-registry
  volumes:
    - name: maven-cache
      hostPath:
        path: /var/lib/lab-ci/m2
        type: DirectoryOrCreate
    - name: trivy-cache
      hostPath:
        path: /var/lib/lab-ci/trivy
        type: DirectoryOrCreate
    - name: buildkit-state
      hostPath:
        path: /var/lib/lab-ci/buildkit
        type: DirectoryOrCreate
  containers:
    - name: ci-tools
      image: docker.io/atakangul/lab-ci-agent@sha256:7ffa97e62c587bb1b8884b2512265e47bba87ae80bd6f61cfa2e41dcc0d6c5de
      imagePullPolicy: IfNotPresent
      command: ["sh", "-c", "sleep infinity"]
      tty: true
      volumeMounts:
        - name: maven-cache
          mountPath: /root/.m2
        - name: trivy-cache
          mountPath: /root/.cache/trivy
      resources:
        requests:
          cpu: 150m
          memory: 384Mi
        limits:
          cpu: "1"
          memory: 1Gi
    - name: buildkit
      image: moby/buildkit:v0.12.2
      imagePullPolicy: IfNotPresent
      args: ["--addr", "unix:///run/buildkit/buildkitd.sock"]
      securityContext:
        privileged: true
      volumeMounts:
        - name: buildkit-state
          mountPath: /var/lib/buildkit
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: "1"
          memory: 1Gi
