apiVersion: v1
kind: Pod
metadata:
  labels:
    component: jenkins-agent
spec:
  serviceAccountName: jenkins-agent
  restartPolicy: Never
  containers:
    - name: ci-tools
      image: docker.io/atakangul/lab-ci-agent:v1
      imagePullPolicy: IfNotPresent
      command: ["sh", "-c", "sleep infinity"]
      tty: true
      resources:
        requests:
          cpu: 150m
          memory: 384Mi
        limits:
          cpu: "1"
          memory: 1Gi
    - name: buildkit
      image: moby/buildkit:v0.12.2
      imagePullPolicy: IfNotPresent
      args: ["--addr", "unix:///run/buildkit/buildkitd.sock"]
      securityContext:
        privileged: true
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: "1"
          memory: 1Gi
