---
- name: Validate immutable image reference
  ansible.builtin.assert:
    that:
      - image_ref is match('^' ~ (image_repository | regex_escape) ~ '@sha256:[0-9a-f]{64}$')
    fail_msg: image_ref must be {{ image_repository }}@sha256:<64 hex>

- name: Read Deployment revision before release
  ansible.builtin.command:
    # argv, not cmd: cmd is shlex-split, which strips the \. escapes jsonpath needs.
    argv: [kubectl, -n, default, get, deployment, sample-java-app, -o,
           'jsonpath={.metadata.annotations.deployment\.kubernetes\.io/revision}']
  register: revision_before_release
  changed_when: false
  # Absent on the very first release; there is then nothing to roll back to.
  failed_when: false

- name: Release and verify
  block:
    - name: Apply application ConfigMap
      ansible.builtin.command:
        cmd: kubectl apply -f app/k8s/fluent-bit-config.yaml
        chdir: "{{ playbook_dir }}/../.."
      changed_when: true

    - name: Apply application Service
      ansible.builtin.command:
        cmd: kubectl apply -f app/k8s/service.yaml
        chdir: "{{ playbook_dir }}/../.."
      changed_when: true

    - name: Apply application ServiceMonitor
      ansible.builtin.command:
        cmd: kubectl apply -f app/k8s/service-monitor.yaml
        chdir: "{{ playbook_dir }}/../.."
      changed_when: true

    - name: Apply application Ingress
      ansible.builtin.command:
        cmd: kubectl apply -f app/k8s/ingress.yaml
        chdir: "{{ playbook_dir }}/../.."
      changed_when: true

    # kubectl patch, not "kubectl set image": set image --local prints nothing when
    # the image already equals the committed one, which fed an empty stream to apply.
    - name: Render Deployment with immutable image and apply it
      ansible.builtin.shell: |
        set -o pipefail
        kubectl patch -f app/k8s/deployment.yaml --local --type=strategic -o yaml \
          -p {{ {'spec': {'template': {'spec': {'containers': [{'name': 'app', 'image': image_ref}]}}}} | to_json | quote }} \
          | kubectl apply -f -
      args:
        executable: /bin/bash
        chdir: "{{ playbook_dir }}/../.."
      changed_when: true

    - name: Wait for application rollout
      ansible.builtin.command:
        cmd: kubectl -n default rollout status deployment/sample-java-app --timeout=180s
      changed_when: false

    - name: Confirm deployed image
      ansible.builtin.command:
        cmd: kubectl -n default get deployment sample-java-app -o jsonpath={.spec.template.spec.containers[?(@.name==\"app\")].image}
      register: deployed_image
      changed_when: false

    - name: Assert deployed digest
      ansible.builtin.assert:
        that:
          - deployed_image.stdout == image_ref
        fail_msg: Deployment image does not match requested immutable digest

  rescue:
    - name: Read Deployment revision after failed release
      ansible.builtin.command:
        argv: [kubectl, -n, default, get, deployment, sample-java-app, -o,
               'jsonpath={.metadata.annotations.deployment\.kubernetes\.io/revision}']
      register: revision_after_failure
      changed_when: false
      failed_when: false

    - name: Decide whether this release moved the Deployment
      ansible.builtin.set_fact:
        # A failure before the Deployment apply leaves the running revision
        # untouched; a plain "rollout undo" would then step back from a
        # healthy revision, so undo only to the exact pre-release revision.
        release_moved_deployment: >-
          {{ revision_before_release.stdout | length > 0
             and revision_after_failure.stdout != revision_before_release.stdout }}

    - name: Undo Deployment to the pre-release revision
      ansible.builtin.command:
        cmd: kubectl -n default rollout undo deployment/sample-java-app --to-revision={{ revision_before_release.stdout }}
      when: release_moved_deployment | bool
      changed_when: true

    - name: Wait for rollback rollout
      ansible.builtin.command:
        cmd: kubectl -n default rollout status deployment/sample-java-app --timeout=180s
      when: release_moved_deployment | bool
      changed_when: false

    - name: Fail release
      ansible.builtin.fail:
        msg: >-
          Release of {{ image_ref }} failed at "{{ ansible_failed_task.name }}":
          {{ ansible_failed_result.msg | default('') }} {{ ansible_failed_result.stderr | default('') }}
          {{ ('Rolled back Deployment to revision ' ~ revision_before_release.stdout ~ '.')
             if (release_moved_deployment | bool)
             else 'Deployment was not changed by this release; nothing rolled back.' }}
          ConfigMap, Service, ServiceMonitor and Ingress are not rolled back.
