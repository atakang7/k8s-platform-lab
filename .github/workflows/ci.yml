name: checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  java:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: app/pom.xml
      - name: Test application
        working-directory: app
        run: sh ./mvnw --batch-mode --no-transfer-progress test

  go:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: policies/resource-requests-webhook/go.mod
          cache-dependency-path: policies/resource-requests-webhook/go.sum
      - name: Test admission webhook
        working-directory: policies/resource-requests-webhook
        run: go test ./...

  shell:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check shell syntax
        run: find . -type f -name '*.sh' -print0 | xargs -0 -r -n1 bash -n
