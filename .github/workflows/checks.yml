name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: app/pom.xml
      - name: Verify Java application
        working-directory: app
        run: ./mvnw --batch-mode --no-transfer-progress verify

  webhook:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: policies/resource-requests-webhook
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: policies/resource-requests-webhook/go.mod
          cache-dependency-path: policies/resource-requests-webhook/go.sum
      - name: Test webhook
        run: go test ./...
      - name: Vet webhook
        run: go vet ./...

  shell:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check shell scripts
        run: |
          find delivery infra platform policies validation -type f \
            \( -name '*.sh' -o -path '*/bin/*' \) \
            -exec shellcheck --external-sources --source-path=SCRIPTDIR --exclude=SC1071 {} +
