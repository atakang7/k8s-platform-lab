[defaults]
roles_path = roles
host_key_checking = False
retry_files_enabled = False
# Fixed, not discovered: discovery on a busy node can time out and silently
# fall back to /usr/bin/python, which Ubuntu 20.04 does not have.
interpreter_python = /usr/bin/python3
stdout_callback = yaml
# A busy node can take longer than the 10 s default to accept SSH.
timeout = 60

[ssh_connection]
pipelining = True
# Retry a dropped SSH connection instead of marking the node unreachable.
retries = 3

