---
- name: Download the pinned Calico manifest
  ansible.builtin.get_url:
    url: "https://raw.githubusercontent.com/projectcalico/calico/{{ calico_source_revision }}/manifests/calico.yaml"
    dest: "/etc/kubernetes/calico-v{{ calico_version }}.upstream.yaml"
    mode: "0644"
  register: calico_upstream

- name: Record Calico rendering inputs
  ansible.builtin.copy:
    dest: /etc/kubernetes/calico.settings
    mode: "0644"
    content: |
      version={{ calico_version }}
      source_revision={{ calico_source_revision }}
      pod_cidr={{ pod_cidr }}
      vm_cidr={{ vm_cidr }}
  register: calico_settings

- name: Check for a rendered Calico manifest
  ansible.builtin.stat:
    path: /etc/kubernetes/calico.yaml
  register: calico_manifest

- name: Start from the pinned upstream Calico manifest
  ansible.builtin.copy:
    src: "/etc/kubernetes/calico-v{{ calico_version }}.upstream.yaml"
    dest: /etc/kubernetes/calico.yaml
    remote_src: true
    mode: "0644"
  when: calico_upstream.changed or calico_settings.changed or not calico_manifest.stat.exists

- name: Configure Calico addressing for the lab networks
  ansible.builtin.replace:
    path: /etc/kubernetes/calico.yaml
    regexp: '(?m)^            # - name: CALICO_IPV4POOL_CIDR\n            #   value: "192\.168\.0\.0/16"$'
    replace: |2-
                  - name: CALICO_IPV4POOL_CIDR
                    value: "{{ pod_cidr }}"
                  - name: IP_AUTODETECTION_METHOD
                    value: "cidr={{ vm_cidr }}"
  when: calico_upstream.changed or calico_settings.changed or not calico_manifest.stat.exists

- name: Assert rendered Calico Pod CIDR
  ansible.builtin.command:
    argv:
      - grep
      - -Fq
      - 'value: "{{ pod_cidr }}"'
      - /etc/kubernetes/calico.yaml
  changed_when: false

- name: Assert rendered Calico node autodetection
  ansible.builtin.command:
    argv:
      - grep
      - -Fq
      - 'value: "cidr={{ vm_cidr }}"'
      - /etc/kubernetes/calico.yaml
  changed_when: false

- name: Apply Calico
  ansible.builtin.command:
    argv:
      - kubectl
      - apply
      - -f
      - /etc/kubernetes/calico.yaml
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: calico_apply
  changed_when: "'created' in calico_apply.stdout or 'configured' in calico_apply.stdout"

- name: Wait for Calico node agents
  ansible.builtin.command:
    argv:
      - kubectl
      - -n
      - kube-system
      - rollout
      - status
      - daemonset/calico-node
      - --timeout=300s
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  changed_when: false

- name: Wait for Calico controllers
  ansible.builtin.command:
    argv:
      - kubectl
      - -n
      - kube-system
      - rollout
      - status
      - deployment/calico-kube-controllers
      - --timeout=300s
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  changed_when: false
