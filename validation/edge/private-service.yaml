# check-cluster.sh applies this in stage3-validation: a LoadBalancer Service
# that does not ask for the edge pool must NOT get an edge IP.
apiVersion: v1
kind: Service
metadata:
  name: no-edge-request
spec:
  type: LoadBalancer
  selector:
    app: stage3-backend
  ports:
    - port: 80
      targetPort: 5678
