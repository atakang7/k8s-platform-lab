# check-cluster.sh applies this in stage3-validation: a Service that asks for
# edge IP 192.168.56.201 must get it. The script then sets a unique
# external-dns.alpha.kubernetes.io/hostname annotation and checks that its DNS
# record appears, and disappears when the Service is deleted.
apiVersion: v1
kind: Service
metadata:
  name: explicit-edge
  annotations:
    metallb.io/address-pool: edge
    metallb.io/loadBalancerIPs: 192.168.56.201
spec:
  type: LoadBalancer
  allocateLoadBalancerNodePorts: false
  selector:
    app: stage3-backend
  ports:
    - port: 80
      targetPort: 5678
