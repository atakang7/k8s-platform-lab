# stage: one replica. prod (values.yaml) shares the lab cluster at full size.
replicas: 1
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 1
ingress:
  host: app-stage.lab.test
# One replica: a budget would leave no Pod evictable and block every drain.
podDisruptionBudget:
  enabled: false
