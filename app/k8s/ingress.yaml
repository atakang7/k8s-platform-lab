apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sample-java-app
  namespace: default
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  tls:
  - hosts:
    - app.lab.test
    secretName: lab-wildcard
  rules:
  - host: app.lab.test
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: sample-java-app
            port:
              number: 80
