apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: dockerhub-registry
  namespace: default
spec:
  vaultAuthRef: dockerhub-runtime
  mount: secret
  type: kv-v2
  path: runtime/dockerhub
  refreshAfter: 1m
  destination:
    create: true
    name: dockerhub-registry
    type: kubernetes.io/dockerconfigjson
    transformation:
      excludeRaw: true
      templates:
        .dockerconfigjson:
          text: |
            {{- $auth := printf "%s:%s" (get .Secrets "username") (get .Secrets "token") | b64enc -}}
            {{- printf "{\"auths\":{\"https://index.docker.io/v1/\":{\"auth\":%q}}}" $auth -}}
