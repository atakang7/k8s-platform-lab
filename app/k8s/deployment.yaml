apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-java-app
  namespace: default
spec:
  replicas: 4
  selector:
    matchLabels:
      app: sample-java-app
      track: stable
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 4
  template:
    metadata:
      labels:
        app: sample-java-app
        track: stable
    spec:
      securityContext:
        fsGroup: 10001
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: DoesNotExist
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app: sample-java-app
        matchLabelKeys:
        - pod-template-hash
      imagePullSecrets:
      - name: dockerhub-registry
      volumes:
      - name: app-logs
        emptyDir: {}
      - name: fluent-bit-config
        configMap:
          name: fluent-bit-config
      containers:
      - name: app
        image: docker.io/atakangul/sample-java-app@sha256:0c81155a4581e5affa528cce2e8d205d58236ded419ff4427e71d963d48cfe86
        ports:
        - containerPort: 9001
        securityContext:
          runAsNonRoot: true
          runAsUser: 10001
          allowPrivilegeEscalation: false
        resources:
          requests:
            cpu: "250m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        volumeMounts:
        - name: app-logs
          mountPath: /var/log/app
        startupProbe:
          httpGet:
            path: /api/foos?val=startup
            port: 9001
          failureThreshold: 60
          periodSeconds: 2
        readinessProbe:
          httpGet:
            path: /api/foos?val=ready
            port: 9001
          periodSeconds: 2
        livenessProbe:
          httpGet:
            path: /api/foos?val=liveness
            port: 9001
          periodSeconds: 10
      - name: fluent-bit
        image: fluent/fluent-bit@sha256:d792375ca8e53be72fc25716c28f291f32c6fc6f4f31d12d0d14bc78cefe9226
        securityContext:
          runAsNonRoot: true
          runAsUser: 10001
          allowPrivilegeEscalation: false
        resources:
          requests:
            cpu: "50m"
            memory: "32Mi"
          limits:
            cpu: "100m"
            memory: "128Mi"
        volumeMounts:
        - name: app-logs
          mountPath: /var/log/app
        - name: fluent-bit-config
          mountPath: /fluent-bit/etc/
