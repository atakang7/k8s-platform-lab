apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: sample-java-app
  namespace: default
  labels:
    release: observability
spec:
  selector:
    matchLabels:
      app: sample-java-app
  namespaceSelector:
    matchNames: [default]
  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: 30s
