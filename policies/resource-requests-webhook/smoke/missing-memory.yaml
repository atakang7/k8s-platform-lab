# policies/bin/smoke dry-runs this against the cluster: it must be DENIED (no memory request).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: policy-smoke-missing-memory
spec:
  replicas: 1
  selector:
    matchLabels:
      app: policy-smoke-missing-memory
  template:
    metadata:
      labels:
        app: policy-smoke-missing-memory
    spec:
      containers:
        - name: pause
          image: registry.k8s.io/pause@sha256:278fb9dbcca9518083ad1e11276933a2e96f23de604a3a08cc3c80002767d24c
          resources:
            requests: {cpu: 10m}
