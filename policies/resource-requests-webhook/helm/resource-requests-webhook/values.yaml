replicaCount: 1

image:
  repository: docker.io/atakangul/resource-requests-webhook
  pullPolicy: IfNotPresent
  digest: ""

# The policy image is public. Private registries may supply pull secrets here.
imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 443

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 200m
    memory: 256Mi

nodeSelector: {}

tolerations: []

affinity: {}
