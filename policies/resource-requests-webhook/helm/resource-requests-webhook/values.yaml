replicaCount: 2

image:
  repository: docker.io/atakangul/resource-requests-webhook
  pullPolicy: IfNotPresent
  digest: ""

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 443

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 256Mi

podDisruptionBudget:
  enabled: true
  minAvailable: 1

spreadAcrossNodes: true

admission:
  environmentLabel: delivery.lab.test/environment
  additionalExcludedNamespaces: []

nodeSelector: {}
tolerations: []
affinity: {}
