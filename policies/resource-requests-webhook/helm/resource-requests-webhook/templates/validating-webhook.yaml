{{- $secretName := printf "%s-tls" (include "resource-requests-webhook.fullname" .) -}}
{{- $secret := lookup "v1" "Secret" .Release.Namespace $secretName -}}
{{- $caCert := "" -}}
{{- $tlsCert := "" -}}
{{- $tlsKey := "" -}}
{{- if and $secret $secret.data -}}
  {{- $caCert = index $secret.data "ca.crt" -}}
  {{- $tlsCert = index $secret.data "tls.crt" -}}
  {{- $tlsKey = index $secret.data "tls.key" -}}
{{- else -}}
  {{- $altNames := list (printf "%s.%s" (include "resource-requests-webhook.fullname" .) .Release.Namespace) (printf "%s.%s.svc" (include "resource-requests-webhook.fullname" .) .Release.Namespace) (printf "%s.%s.svc.cluster.local" (include "resource-requests-webhook.fullname" .) .Release.Namespace) -}}
  {{- $ca := genCA "resource-requests-webhook-ca" 3650 -}}
  {{- $cert := genSignedCert (include "resource-requests-webhook.fullname" .) nil $altNames 3650 $ca -}}
  {{- $caCert = $ca.Cert | b64enc -}}
  {{- $tlsCert = $cert.Cert | b64enc -}}
  {{- $tlsKey = $cert.Key | b64enc -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    app.kubernetes.io/name: {{ include "resource-requests-webhook.name" . }}
    helm.sh/chart: {{ include "resource-requests-webhook.chart" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
type: kubernetes.io/tls
data:
  ca.crt: {{ $caCert }}
  tls.crt: {{ $tlsCert }}
  tls.key: {{ $tlsKey }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: {{ include "resource-requests-webhook.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "resource-requests-webhook.name" . }}
    helm.sh/chart: {{ include "resource-requests-webhook.chart" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
webhooks:
  - name: validate-resource-requests.lab.com
    clientConfig:
      service:
        name: {{ include "resource-requests-webhook.fullname" . }}
        namespace: {{ .Release.Namespace }}
        path: /validate
      caBundle: {{ $caCert }}
    rules:
      - operations: ["CREATE", "UPDATE"]
        apiGroups: ["apps"]
        apiVersions: ["v1"]
        resources: ["deployments"]
    failurePolicy: Fail
    sideEffects: None
    admissionReviewVersions: ["v1"]
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values:
            - kube-system
            - kube-public
            - kube-node-lease
            - {{ .Release.Namespace }}
