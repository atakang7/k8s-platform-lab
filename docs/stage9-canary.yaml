# Stage 9 sample manifest: canary release with ingress-nginx.
# Illustrative only; not part of the live sample-java-app deployment.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: critical-app-v1
spec:
  replicas: 4
  selector:
    matchLabels:
      app: critical-app
      version: v1
  template:
    metadata:
      labels:
        app: critical-app
        version: v1
    spec:
      containers:
        - name: app
          image: example/critical-app:v1
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: critical-app-stable
spec:
  selector:
    app: critical-app
    version: v1
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: critical-app-stable
spec:
  ingressClassName: nginx
  rules:
    - host: critical.lab.test
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: critical-app-stable
                port:
                  number: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: critical-app-v2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: critical-app
      version: v2
  template:
    metadata:
      labels:
        app: critical-app
        version: v2
    spec:
      containers:
        - name: app
          image: example/critical-app:v2
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: critical-app-canary
spec:
  selector:
    app: critical-app
    version: v2
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: critical-app-canary
  annotations:
    nginx.ingress.kubernetes.io/canary: "true"
    nginx.ingress.kubernetes.io/canary-weight: "5"
spec:
  ingressClassName: nginx
  rules:
    - host: critical.lab.test
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: critical-app-canary
                port:
                  number: 80
