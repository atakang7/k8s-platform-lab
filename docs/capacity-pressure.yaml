# Reference manifest for fixed-capacity scheduling.
# This is a design reference, not part of baseline reconciliation.

apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: app-critical
value: 100000
globalDefault: false
preemptionPolicy: PreemptLowerPriority
description: "Critical real-time workload; may preempt interruptible batch capacity."
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: batch-low
value: 100
globalDefault: false
description: "Restartable batch workload; yields capacity to the critical application."
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: sample-java-app
  namespace: default
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: sample-java-app
  minReplicas: 4
  maxReplicas: 8
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
        - type: Percent
          value: 100
          periodSeconds: 60
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 300
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: sample-java-app
  namespace: default
spec:
  minAvailable: 3
  selector:
    matchLabels:
      app: sample-java-app
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: interruptible-batch
  namespace: default
spec:
  schedule: "*/10 * * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 6
      template:
        metadata:
          labels:
            app: interruptible-batch
        spec:
          restartPolicy: OnFailure
          priorityClassName: batch-low
          containers:
            - name: batch
              image: busybox:1.36
              command: ["sh", "-c", "sleep 300"]
              resources:
                requests:
                  cpu: "250m"
                  memory: "256Mi"
                limits:
                  cpu: "500m"
                  memory: "512Mi"

# The existing sample-java-app Deployment should reference priorityClassName:
# app-critical. Its current 4-replica baseline, resource requests, and topology
# spread remain the minimum operating footprint; HPA scales above that floor.