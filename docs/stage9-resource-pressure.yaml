# Stage 9 sample: fixed-capacity cluster under resource pressure.
#
# App X is the existing sample-java-app Deployment. We deliberately do not
# duplicate that Deployment here. Its current resource requests/limits and
# four-replica topology remain the production source of truth.
#
# To opt App X into this scheduling policy, its Pod template would add:
#
#   spec:
#     template:
#       spec:
#         priorityClassName: app-x-critical
#
# App Y is modeled as interruptible batch work because the requirements say it may
# be paused/killed. The values below are illustrative.

apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: app-x-critical
value: 100000
globalDefault: false
preemptionPolicy: PreemptLowerPriority
description: "Critical real-time workload; may preempt batch capacity when the cluster is full."
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: app-y-batch
value: 100
globalDefault: false
preemptionPolicy: PreemptLowerPriority
description: "Interruptible batch workload; yields capacity to App X under pressure."
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: sample-java-app
  namespace: default
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: sample-java-app
  minReplicas: 4
  maxReplicas: 8
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
        - type: Percent
          value: 100
          periodSeconds: 60
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 300
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: sample-java-app
  namespace: default
spec:
  minAvailable: 3
  selector:
    matchLabels:
      app: sample-java-app
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: app-y-batch
  namespace: default
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 3
      template:
        metadata:
          labels:
            app: app-y-batch
        spec:
          priorityClassName: app-y-batch
          restartPolicy: Never
          containers:
            - name: batch
              image: busybox:1.36
              command: ["sh", "-c", "echo batch-start; sleep 120; echo batch-complete"]
              resources:
                requests:
                  cpu: "250m"
                  memory: "256Mi"
                limits:
                  cpu: "500m"
                  memory: "512Mi"
