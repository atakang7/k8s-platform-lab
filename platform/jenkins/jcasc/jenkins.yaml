jenkins:
  numExecutors: 0
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "${chart-admin-username}"
          password: "${chart-admin-password}"
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false
  clouds:
    - kubernetes:
        name: kubernetes
        namespace: jenkins
        serverUrl: https://kubernetes.default.svc.cluster.local
        jenkinsUrl: http://jenkins.jenkins.svc.cluster.local:8080
        webSocket: true
        templates:
          - name: ci-runner
            label: lab-ci-runner
            namespace: jenkins
            idleMinutes: 60
            instanceCap: 1
            nodeUsageMode: EXCLUSIVE
            showRawYaml: false
            slaveConnectTimeout: 120
            yamlMergeStrategy: override
            yaml: |-
              apiVersion: v1
              kind: Pod
              metadata:
                labels:
                  component: jenkins-agent
                  workload: lab-ci-runner
              spec:
                # Dry-run only: see jenkins-ci-dry-run-only in platform/jenkins/resources/agent-rbac.yaml.
                serviceAccountName: jenkins-ci
                restartPolicy: Never
                nodeSelector:
                  kubernetes.io/hostname: node-3
                imagePullSecrets:
                  - name: dockerhub-registry
                volumes:
                  - name: maven-cache
                    hostPath:
                      path: /var/lib/lab-ci/m2
                      type: DirectoryOrCreate
                  - name: trivy-cache
                    hostPath:
                      path: /var/lib/lab-ci/trivy
                      type: DirectoryOrCreate
                  - name: buildkit-state
                    hostPath:
                      path: /var/lib/lab-ci/buildkit-rootless
                      type: DirectoryOrCreate
                initContainers:
                  # hostPath is created root-owned; rootless BuildKit runs as uid 1000.
                  - name: buildkit-state-owner
                    image: moby/buildkit:v0.33.0-rootless@sha256:80b15f0735e87bab7bf59ec4d695dfb4a7cfb25521cf56dc75d6f256285b63ef
                    command: ["chown", "1000:1000", "/state"]
                    securityContext:
                      runAsUser: 0
                    volumeMounts:
                      - name: buildkit-state
                        mountPath: /state
                    resources:
                      requests:
                        cpu: 10m
                        memory: 16Mi
                      limits:
                        cpu: 100m
                        memory: 32Mi
                containers:
                  - name: ci-tools
                    image: docker.io/atakangul/lab-ci-agent@sha256:07d47b2132a5f349d34790bd4a421d4d3636668cc20bbc29743716b7212faa1e
                    imagePullPolicy: IfNotPresent
                    command: ["sh", "-c", "sleep infinity"]
                    tty: true
                    volumeMounts:
                      - name: maven-cache
                        mountPath: /root/.m2
                      - name: trivy-cache
                        mountPath: /root/.cache/trivy
                    resources:
                      requests:
                        cpu: 150m
                        memory: 384Mi
                      limits:
                        cpu: "1"
                        memory: 1Gi
                  - name: buildkit
                    # Rootless: no privileged mode. buildctl finds the socket via the image's BUILDKIT_HOST.
                    image: moby/buildkit:v0.33.0-rootless@sha256:80b15f0735e87bab7bf59ec4d695dfb4a7cfb25521cf56dc75d6f256285b63ef
                    imagePullPolicy: IfNotPresent
                    args: ["--oci-worker-no-process-sandbox"]
                    securityContext:
                      runAsUser: 1000
                      runAsGroup: 1000
                      seccompProfile:
                        type: Unconfined
                      appArmorProfile:
                        type: Unconfined
                    volumeMounts:
                      - name: buildkit-state
                        mountPath: /home/user/.local/share/buildkit
                    resources:
                      requests:
                        cpu: 100m
                        memory: 256Mi
                      limits:
                        cpu: "1"
                        memory: 1Gi
          - name: cd-runner
            label: lab-cd-runner
            namespace: jenkins
            idleMinutes: 60
            instanceCap: 1
            nodeUsageMode: EXCLUSIVE
            showRawYaml: false
            slaveConnectTimeout: 120
            yamlMergeStrategy: override
            yaml: |-
              apiVersion: v1
              kind: Pod
              metadata:
                labels:
                  component: jenkins-agent
                  workload: lab-cd-runner
              spec:
                serviceAccountName: jenkins-agent
                restartPolicy: Never
                nodeSelector:
                  kubernetes.io/hostname: node-3
                imagePullSecrets:
                  - name: dockerhub-registry
                containers:
                  - name: ci-tools
                    image: docker.io/atakangul/lab-ci-agent@sha256:07d47b2132a5f349d34790bd4a421d4d3636668cc20bbc29743716b7212faa1e
                    imagePullPolicy: IfNotPresent
                    command: ["sh", "-c", "sleep infinity"]
                    tty: true
                    resources:
                      requests:
                        cpu: 100m
                        memory: 256Mi
                      limits:
                        cpu: "1"
                        memory: 768Mi

credentials:
  system:
    domainCredentials:
      - credentials:
          - usernamePassword:
              scope: GLOBAL
              id: github-creds
              description: GitHub private repository credential
              username: "${GITHUB_USERNAME}"
              password: "${GITHUB_TOKEN}"
          - usernamePassword:
              scope: GLOBAL
              id: dockerhub-creds
              description: DockerHub CI credential
              username: "${DOCKERHUB_USERNAME}"
              password: "${DOCKERHUB_TOKEN}"
          - file:
              scope: GLOBAL
              id: kubeconfig
              description: Cluster Kubeconfig
              fileName: kubeconfig
              secretBytes: "${KUBECONFIG_BASE64}"

jobs:
  - script: >
      pipelineJob('lab-build') {
        description('Lab CI pipeline')
        triggers { scm('* * * * *') }
        definition {
          cpsScm {
            scm {
              git {
                remote {
                  url('https://github.com/atakang7/k8s-platform-lab.git')
                  credentials('github-creds')
                }
                branch('*/main')
              }
            }
            scriptPath('delivery/Jenkinsfile.build')
            lightweight(false)
          }
        }
      }
  - script: >
      pipelineJob('lab-deploy') {
        description('Lab deployment pipeline')
        parameters {
          stringParam('IMAGE_REF', '', 'Immutable image reference repository@sha256:...')
          stringParam('COMMIT_SHA', '', 'Exact Git commit SHA associated with this deployment')
        }
        definition {
          cpsScm {
            scm {
              git {
                remote {
                  url('https://github.com/atakang7/k8s-platform-lab.git')
                  credentials('github-creds')
                }
                branch('*/main')
              }
            }
            scriptPath('delivery/Jenkinsfile.deploy')
            lightweight(true)
          }
        }
      }

unclassified:
  location:
    url: https://jenkins.lab.test/
