jenkins:
  numExecutors: 0
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "${chart-admin-username}"
          password: "${chart-admin-password}"
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false
  clouds:
    - kubernetes:
        name: kubernetes
        namespace: jenkins
        serverUrl: https://kubernetes.default.svc.cluster.local
        jenkinsUrl: http://jenkins.jenkins.svc.cluster.local:8080
        webSocket: true
        templates:
          - name: ci-runner
            label: lab-ci-runner
            namespace: jenkins
            idleMinutes: 60
            instanceCap: 1
            nodeUsageMode: EXCLUSIVE
            showRawYaml: false
            slaveConnectTimeout: 120
            yamlMergeStrategy: override
            yaml: |-
              apiVersion: v1
              kind: Pod
              metadata:
                labels:
                  component: jenkins-agent
                  workload: lab-ci-runner
              spec:
                # Dry-run only: see jenkins-ci-dry-run-only in platform/jenkins/resources/agent-rbac.yaml.
                serviceAccountName: jenkins-ci
                enableServiceLinks: false
                restartPolicy: Never
                nodeSelector:
                  kubernetes.io/hostname: node-3
                imagePullSecrets:
                  - name: dockerhub-registry
                volumes:
                  - name: trivy-cache
                    hostPath:
                      path: /var/lib/lab-ci/trivy
                      type: DirectoryOrCreate
                  - name: buildkit-state
                    hostPath:
                      path: /var/lib/lab-ci/buildkit-rootless
                      type: DirectoryOrCreate
                initContainers:
                  # hostPath is created root-owned; rootless BuildKit runs as uid 1000.
                  - name: buildkit-state-owner
                    image: moby/buildkit:v0.33.0-rootless@sha256:80b15f0735e87bab7bf59ec4d695dfb4a7cfb25521cf56dc75d6f256285b63ef
                    command: ["chown", "1000:1000", "/state"]
                    securityContext:
                      runAsUser: 0
                      runAsGroup: 0
                      allowPrivilegeEscalation: false
                      capabilities:
                        drop: ["ALL"]
                        add: ["CHOWN"]
                      seccompProfile:
                        type: RuntimeDefault
                    volumeMounts:
                      - name: buildkit-state
                        mountPath: /state
                    resources:
                      requests:
                        cpu: 10m
                        memory: 16Mi
                      limits:
                        cpu: 100m
                        memory: 32Mi
                containers:
                  - name: ci-tools
                    image: docker.io/atakangul/lab-ci-agent@sha256:e5639dcf91bb3055fa067e0d4a0f70e0e705704b056872ee6553534b04ca8e5e
                    imagePullPolicy: IfNotPresent
                    command: ["sh", "-c", "sleep infinity"]
                    tty: true
                    volumeMounts:
                      - name: trivy-cache
                        mountPath: /root/.cache/trivy
                    resources:
                      requests:
                        cpu: 150m
                        memory: 384Mi
                      limits:
                        cpu: "1"
                        memory: 1Gi
                  # chart-testing for base chart pull requests (delivery/Jenkinsfile.platform).
                  - name: chart-testing
                    image: quay.io/helmpack/chart-testing:v3.14.0@sha256:425ff3058dfc192fffb94e471e732b9bc995c375df963eba417ff01aea594e83
                    imagePullPolicy: IfNotPresent
                    command: ["sh", "-c", "sleep infinity"]
                    resources:
                      requests:
                        cpu: 10m
                        memory: 32Mi
                      limits:
                        cpu: 500m
                        memory: 256Mi
                  - name: buildkit
                    # Rootless: no privileged mode. buildctl finds the socket via the image's BUILDKIT_HOST.
                    image: moby/buildkit:v0.33.0-rootless@sha256:80b15f0735e87bab7bf59ec4d695dfb4a7cfb25521cf56dc75d6f256285b63ef
                    imagePullPolicy: IfNotPresent
                    args: ["--oci-worker-no-process-sandbox"]
                    securityContext:
                      runAsUser: 1000
                      runAsGroup: 1000
                      seccompProfile:
                        type: Unconfined
                      appArmorProfile:
                        type: Unconfined
                    volumeMounts:
                      - name: buildkit-state
                        mountPath: /home/user/.local/share/buildkit
                    resources:
                      requests:
                        cpu: 100m
                        memory: 256Mi
                      limits:
                        cpu: "1"
                        memory: 1Gi
          - name: cd-runner
            label: lab-cd-runner
            namespace: jenkins
            idleMinutes: 60
            instanceCap: 1
            nodeUsageMode: EXCLUSIVE
            showRawYaml: false
            slaveConnectTimeout: 120
            yamlMergeStrategy: override
            yaml: |-
              apiVersion: v1
              kind: Pod
              metadata:
                labels:
                  component: jenkins-agent
                  workload: lab-cd-runner
              spec:
                serviceAccountName: jenkins-agent
                enableServiceLinks: false
                restartPolicy: Never
                nodeSelector:
                  kubernetes.io/hostname: node-3
                imagePullSecrets:
                  - name: dockerhub-registry
                containers:
                  - name: ci-tools
                    image: docker.io/atakangul/lab-ci-agent@sha256:e5639dcf91bb3055fa067e0d4a0f70e0e705704b056872ee6553534b04ca8e5e
                    imagePullPolicy: IfNotPresent
                    command: ["sh", "-c", "sleep infinity"]
                    tty: true
                    resources:
                      requests:
                        cpu: 100m
                        memory: 256Mi
                      limits:
                        cpu: "1"
                        memory: 768Mi

credentials:
  system:
    domainCredentials:
      - credentials:
          - usernamePassword:
              scope: GLOBAL
              id: github-creds
              description: GitHub private repository credential
              username: "${GITHUB_USERNAME}"
              password: "${GITHUB_TOKEN}"
          - usernamePassword:
              scope: GLOBAL
              id: dockerhub-creds
              description: DockerHub CI credential
              username: "${DOCKERHUB_USERNAME}"
              password: "${DOCKERHUB_TOKEN}"

jobs:
  - script: |
      // GitHub multibranch jobs: every branch and pull request is built, and
      // GitHub Branch Source posts the commit statuses. Onboarding a service is
      // one entry here plus its chart and a two-line Jenkinsfile.
      def services = [
        [name: 'sample-java-app', jenkinsfile: 'app/Jenkinsfile'],
        [name: 'resource-requests-webhook', jenkinsfile: 'policies/resource-requests-webhook/Jenkinsfile'],
      ]
      def githubOwner = 'atakang7'
      def githubRepository = 'lab'

      def githubMultibranch = { String name, String jenkinsfile ->
        multibranchPipelineJob(name) {
          branchSources {
            branchSource {
              source {
                github {
                  id(name)
                  repoOwner(githubOwner)
                  repository(githubRepository)
                  repositoryUrl("https://github.com/${githubOwner}/${githubRepository}")
                  configuredByUrl(true)
                  credentialsId('github-creds')
                  traits {
                    gitHubBranchDiscovery { strategyId(1) }          // branches that are not pull requests
                    gitHubPullRequestDiscovery { strategyId(1) }     // pull requests merged with their target
                  }
                }
              }
            }
          }
          factory { workflowBranchProjectFactory { scriptPath(jenkinsfile) } }
          // Jenkins is not reachable from GitHub, so branches are re-indexed instead of webhooks.
          triggers { periodicFolderTrigger { interval('1m') } }
          orphanedItemStrategy { discardOldItems { numToKeep(10) } }
        }
      }

      services.each { service -> githubMultibranch(service.name, service.jenkinsfile) }
      githubMultibranch('platform', 'delivery/Jenkinsfile.platform')

      // Releases every environment to its state/<name>.yaml (environments.yaml).
      githubMultibranch('deploy', 'delivery/Jenkinsfile.deploy')

unclassified:
  # The platform delivery library (delivery/pipeline). Services cannot choose
  # another version: the platform decides what runs in every pipeline.
  globalLibraries:
    libraries:
      - name: lab-delivery
        defaultVersion: main
        implicit: false
        allowVersionOverride: false
        retriever:
          modernSCM:
            libraryPath: delivery/pipeline/
            scm:
              git:
                remote: https://github.com/atakang7/k8s-platform-lab.git
                credentialsId: github-creds
  location:
    url: https://jenkins.lab.test/
