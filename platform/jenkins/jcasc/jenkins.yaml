jenkins:
  numExecutors: 0
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "${chart-admin-username}"
          password: "${chart-admin-password}"
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false
  clouds:
    - kubernetes:
        name: kubernetes
        namespace: jenkins
        serverUrl: https://kubernetes.default.svc.cluster.local
        jenkinsUrl: http://jenkins.jenkins.svc.cluster.local:8080
        webSocket: true
        templates:
          - name: warm-build
            label: lab-ci-build
            namespace: jenkins
            idleMinutes: 60
            instanceCap: 1
            nodeUsageMode: EXCLUSIVE
            showRawYaml: false
            slaveConnectTimeout: 120
            yamlMergeStrategy: override
            yaml: |-
              apiVersion: v1
              kind: Pod
              metadata:
                labels:
                  component: jenkins-agent
                  workload: lab-ci-build
              spec:
                serviceAccountName: jenkins-agent
                restartPolicy: Never
                nodeSelector:
                  kubernetes.io/hostname: node-3
                imagePullSecrets:
                  - name: dockerhub-registry
                volumes:
                  - name: maven-cache
                    hostPath:
                      path: /var/lib/lab-ci/m2
                      type: DirectoryOrCreate
                  - name: trivy-cache
                    hostPath:
                      path: /var/lib/lab-ci/trivy
                      type: DirectoryOrCreate
                  - name: buildkit-state
                    hostPath:
                      path: /var/lib/lab-ci/buildkit
                      type: DirectoryOrCreate
                containers:
                  - name: ci-tools
                    image: docker.io/atakangul/lab-ci-agent@sha256:7ffa97e62c587bb1b8884b2512265e47bba87ae80bd6f61cfa2e41dcc0d6c5de
                    imagePullPolicy: IfNotPresent
                    command: ["sh", "-c", "sleep infinity"]
                    tty: true
                    volumeMounts:
                      - name: maven-cache
                        mountPath: /root/.m2
                      - name: trivy-cache
                        mountPath: /root/.cache/trivy
                    resources:
                      requests:
                        cpu: 150m
                        memory: 384Mi
                      limits:
                        cpu: "1"
                        memory: 1Gi
                  - name: buildkit
                    image: moby/buildkit:v0.12.2
                    imagePullPolicy: IfNotPresent
                    args: ["--addr", "unix:///run/buildkit/buildkitd.sock"]
                    securityContext:
                      privileged: true
                    volumeMounts:
                      - name: buildkit-state
                        mountPath: /var/lib/buildkit
                    resources:
                      requests:
                        cpu: 100m
                        memory: 256Mi
                      limits:
                        cpu: "1"
                        memory: 1Gi
          - name: warm-deploy
            label: lab-ci-deploy
            namespace: jenkins
            idleMinutes: 60
            instanceCap: 1
            nodeUsageMode: EXCLUSIVE
            showRawYaml: false
            slaveConnectTimeout: 120
            yamlMergeStrategy: override
            yaml: |-
              apiVersion: v1
              kind: Pod
              metadata:
                labels:
                  component: jenkins-agent
                  workload: lab-ci-deploy
              spec:
                serviceAccountName: jenkins-agent
                restartPolicy: Never
                nodeSelector:
                  kubernetes.io/hostname: node-3
                imagePullSecrets:
                  - name: dockerhub-registry
                containers:
                  - name: ci-tools
                    image: docker.io/atakangul/lab-ci-agent@sha256:7ffa97e62c587bb1b8884b2512265e47bba87ae80bd6f61cfa2e41dcc0d6c5de
                    imagePullPolicy: IfNotPresent
                    command: ["sh", "-c", "sleep infinity"]
                    tty: true
                    resources:
                      requests:
                        cpu: 100m
                        memory: 256Mi
                      limits:
                        cpu: "1"
                        memory: 768Mi

credentials:
  system:
    domainCredentials:
      - credentials:
          - usernamePassword:
              scope: GLOBAL
              id: github-creds
              description: GitHub private repository credential
              username: "${GITHUB_USERNAME}"
              password: "${GITHUB_TOKEN}"
          - usernamePassword:
              scope: GLOBAL
              id: dockerhub-creds
              description: DockerHub CI credential
              username: "${DOCKERHUB_USERNAME}"
              password: "${DOCKERHUB_TOKEN}"
          - file:
              scope: GLOBAL
              id: kubeconfig
              description: Cluster Kubeconfig
              fileName: kubeconfig
              secretBytes: "${KUBECONFIG_BASE64}"

jobs:
  - script: >
      pipelineJob('lab-build') {
        description('Lab CI pipeline')
        triggers { scm('H/2 * * * *') }
        definition {
          cpsScm {
            scm {
              git {
                remote {
                  url('https://github.com/atakang7/k8s-platform-lab.git')
                  credentials('github-creds')
                }
                branch('*/main')
              }
            }
            scriptPath('delivery/Jenkinsfile.build')
            lightweight(false)
          }
        }
      }
  - script: >
      pipelineJob('lab-deploy') {
        description('Lab deployment pipeline')
        parameters {
          stringParam('IMAGE_REF', '', 'Immutable image reference repository@sha256:...')
          stringParam('COMMIT_SHA', '', 'Exact Git commit SHA associated with this deployment')
        }
        definition {
          cpsScm {
            scm {
              git {
                remote {
                  url('https://github.com/atakang7/k8s-platform-lab.git')
                  credentials('github-creds')
                }
                branch('*/main')
              }
            }
            scriptPath('delivery/Jenkinsfile.deploy')
            lightweight(true)
          }
        }
      }

unclassified:
  location:
    url: https://jenkins.lab.test/
