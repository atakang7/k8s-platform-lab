jenkins:
  numExecutors: 0
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "${chart-admin-username}"
          password: "${chart-admin-password}"
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false
  clouds:
    - kubernetes:
        name: kubernetes
        namespace: jenkins
        serverUrl: https://kubernetes.default.svc.cluster.local
        jenkinsUrl: http://jenkins.jenkins.svc.cluster.local:8080
        webSocket: true
        # This edge cluster is memory-constrained: never allow Jenkins agent pods
        # to accumulate faster than the workers can safely host them.
        containerCapStr: "2"
        templates:
          - name: ci-runner
            label: lab-ci-runner
            namespace: jenkins
            idleMinutes: 10
            instanceCap: 1
            nodeUsageMode: EXCLUSIVE
            showRawYaml: false
            slaveConnectTimeout: 120
            yamlMergeStrategy: override
            yaml: |-
              apiVersion: v1
              kind: Pod
              metadata:
                labels:
                  component: jenkins-agent
                  workload: lab-ci-runner
              spec:
                # Dry-run only: see jenkins-ci-dry-run-only in platform/jenkins/resources/agent-rbac.yaml.
                serviceAccountName: jenkins-ci
                enableServiceLinks: false
                restartPolicy: Never
                nodeSelector:
                  kubernetes.io/hostname: node-3
                volumes:
                  - name: trivy-cache
                    hostPath:
                      path: /var/lib/lab-ci/trivy
                      type: DirectoryOrCreate
                  - name: buildkit-state
                    hostPath:
                      path: /var/lib/lab-ci/buildkit-rootless
                      type: DirectoryOrCreate
                initContainers:
                  # hostPaths are created root-owned; BuildKit and ci-tools run as uid 1000.
                  # BuildKit keeps its own state private, so only the Trivy cache,
                  # written earlier as root, is chowned recursively - and only while
                  # its root is not uid 1000's yet: Trivy then writes 0700 directories
                  # that root with only CHOWN cannot enter, and chown -R would fail.
                  - name: cache-owner
                    image: moby/buildkit:v0.33.0-rootless@sha256:80b15f0735e87bab7bf59ec4d695dfb4a7cfb25521cf56dc75d6f256285b63ef
                    command: ["sh", "-c", "chown 1000:1000 /state && { [ \"$(stat -c %u /trivy)\" = 1000 ] || chown -R 1000:1000 /trivy; }"]
                    securityContext:
                      runAsUser: 0
                      runAsGroup: 0
                      allowPrivilegeEscalation: false
                      capabilities:
                        drop: ["ALL"]
                        add: ["CHOWN"]
                      seccompProfile:
                        type: RuntimeDefault
                    volumeMounts:
                      - name: buildkit-state
                        mountPath: /state
                      - name: trivy-cache
                        mountPath: /trivy
                    resources:
                      requests:
                        cpu: 10m
                        memory: 16Mi
                      limits:
                        cpu: 100m
                        memory: 32Mi
                containers:
                  - name: ci-tools
                    image: docker.io/atakangul/lab-ci-agent@sha256:da753bea05c1d34e390a847ee44d562fd2cc2db6e4abd8d395d73111fa819e72
                    imagePullPolicy: IfNotPresent
                    command: ["sh", "-c", "sleep infinity"]
                    tty: true
                    # The Jenkins agent's user: both write the shared workspace, and
                    # no delivery step needs root. HOME is the writable workspace.
                    securityContext:
                      runAsUser: 1000
                      runAsGroup: 1000
                    env:
                      - name: HOME
                        value: /home/jenkins/agent
                      - name: TRIVY_CACHE_DIR
                        value: /var/cache/trivy
                    volumeMounts:
                      - name: trivy-cache
                        mountPath: /var/cache/trivy
                    resources:
                      requests:
                        cpu: 150m
                        memory: 384Mi
                      limits:
                        cpu: "1"
                        memory: 1Gi
                  # chart-testing for base chart pull requests (delivery/Jenkinsfile.platform).
                  - name: chart-testing
                    image: quay.io/helmpack/chart-testing:v3.14.0@sha256:425ff3058dfc192fffb94e471e732b9bc995c375df963eba417ff01aea594e83
                    imagePullPolicy: IfNotPresent
                    command: ["sh", "-c", "sleep infinity"]
                    resources:
                      requests:
                        cpu: 10m
                        memory: 32Mi
                      limits:
                        cpu: 500m
                        memory: 256Mi
                  - name: buildkit
                    # Rootless: no privileged mode. buildctl finds the socket via the image's BUILDKIT_HOST.
                    image: moby/buildkit:v0.33.0-rootless@sha256:80b15f0735e87bab7bf59ec4d695dfb4a7cfb25521cf56dc75d6f256285b63ef
                    imagePullPolicy: IfNotPresent
                    args: ["--oci-worker-no-process-sandbox"]
                    securityContext:
                      runAsUser: 1000
                      runAsGroup: 1000
                      seccompProfile:
                        type: Unconfined
                      appArmorProfile:
                        type: Unconfined
                    volumeMounts:
                      - name: buildkit-state
                        mountPath: /home/user/.local/share/buildkit
                    resources:
                      requests:
                        cpu: 100m
                        memory: 256Mi
                      limits:
                        cpu: "1"
                        memory: 1Gi
          # Jobs that build nothing (platform lint, deploy verification) run here, so
          # they do not queue behind an image build on the one ci-runner, whose
          # BuildKit and Trivy caches pin it to node-3.
          - name: ci-light
            label: lab-ci-light
            namespace: jenkins
            idleMinutes: 5
            instanceCap: 1
            nodeUsageMode: EXCLUSIVE
            showRawYaml: false
            slaveConnectTimeout: 120
            yamlMergeStrategy: override
            yaml: |-
              apiVersion: v1
              kind: Pod
              metadata:
                labels:
                  component: jenkins-agent
                  workload: lab-ci-light
              spec:
                # Dry-run only: see jenkins-ci-dry-run-only in platform/jenkins/resources/agent-rbac.yaml.
                serviceAccountName: jenkins-ci
                enableServiceLinks: false
                restartPolicy: Never
                # Off node-3: its memory is the image-build runner's, which is pinned
                # there with its caches.
                affinity:
                  nodeAffinity:
                    requiredDuringSchedulingIgnoredDuringExecution:
                      nodeSelectorTerms:
                        - matchExpressions:
                            - key: kubernetes.io/hostname
                              operator: NotIn
                              values: ["node-3"]
                containers:
                  - name: jnlp
                    resources:
                      requests:
                        cpu: 50m
                        memory: 128Mi
                      limits:
                        memory: 512Mi
                  - name: ci-tools
                    image: docker.io/atakangul/lab-ci-agent@sha256:da753bea05c1d34e390a847ee44d562fd2cc2db6e4abd8d395d73111fa819e72
                    imagePullPolicy: IfNotPresent
                    command: ["sh", "-c", "sleep infinity"]
                    tty: true
                    # The Jenkins agent's user: both write the shared workspace, and
                    # no delivery step needs root. HOME is the writable workspace.
                    securityContext:
                      runAsUser: 1000
                      runAsGroup: 1000
                    env:
                      - name: HOME
                        value: /home/jenkins/agent
                    # Lint and dry-runs only: no image is built or scanned here.
                    resources:
                      requests:
                        cpu: 100m
                        memory: 128Mi
                      limits:
                        cpu: "1"
                        memory: 512Mi
                  # chart-testing for base chart pull requests (delivery/Jenkinsfile.platform).
                  - name: chart-testing
                    image: quay.io/helmpack/chart-testing:v3.14.0@sha256:425ff3058dfc192fffb94e471e732b9bc995c375df963eba417ff01aea594e83
                    imagePullPolicy: IfNotPresent
                    command: ["sh", "-c", "sleep infinity"]
                    resources:
                      requests:
                        cpu: 10m
                        memory: 32Mi
                      limits:
                        cpu: 500m
                        memory: 256Mi
          - name: cd-runner
            label: lab-cd-runner
            namespace: jenkins
            idleMinutes: 10
            instanceCap: 1
            nodeUsageMode: EXCLUSIVE
            showRawYaml: false
            slaveConnectTimeout: 120
            yamlMergeStrategy: override
            yaml: |-
              apiVersion: v1
              kind: Pod
              metadata:
                labels:
                  component: jenkins-agent
                  workload: lab-cd-runner
              spec:
                # No identity of its own: the deploy job runs each environment
                # from a Pod inheriting this template with that environment's
                # jenkins-deploy-<name> ServiceAccount (deployPipeline.groovy).
                enableServiceLinks: false
                restartPolicy: Never
                nodeSelector:
                  kubernetes.io/hostname: node-3
                containers:
                  - name: ci-tools
                    image: docker.io/atakangul/lab-ci-agent@sha256:da753bea05c1d34e390a847ee44d562fd2cc2db6e4abd8d395d73111fa819e72
                    imagePullPolicy: IfNotPresent
                    command: ["sh", "-c", "sleep infinity"]
                    tty: true
                    # The Jenkins agent's user: both write the shared workspace, and
                    # no delivery step needs root. HOME is the writable workspace.
                    securityContext:
                      runAsUser: 1000
                      runAsGroup: 1000
                    env:
                      - name: HOME
                        value: /home/jenkins/agent
                    resources:
                      requests:
                        cpu: 100m
                        memory: 256Mi
                      limits:
                        cpu: "1"
                        memory: 768Mi

credentials:
  system:
    domainCredentials:
      - credentials:
          - usernamePassword:
              scope: GLOBAL
              id: github-creds
              description: GitHub private repository credential
              username: "${GITHUB_USERNAME}"
              password: "${GITHUB_TOKEN}"
          - usernamePassword:
              scope: GLOBAL
              id: dockerhub-creds
              description: DockerHub CI credential
              username: "${DOCKERHUB_USERNAME}"
              password: "${DOCKERHUB_TOKEN}"
          # Delivery image signing key (cosign); its public half ships in the
          # delivery library as cosign.pub.
          - string:
              scope: GLOBAL
              id: cosign-private-key
              description: Delivery image signing key
              secret: "${COSIGN_PRIVATE_KEY}"
          - string:
              scope: GLOBAL
              id: cosign-password
              description: Delivery image signing key password
              secret: "${COSIGN_PASSWORD}"

jobs:
  - script: |
      // GitHub multibranch jobs: main and every pull request are built, and
      // GitHub Branch Source posts the commit statuses. Onboarding a service is
      // one entry here plus its chart and a two-line Jenkinsfile.
      def services = [
        [name: 'sample-java-app', jenkinsfile: 'app/Jenkinsfile'],
        [name: 'resource-requests-webhook', jenkinsfile: 'policies/resource-requests-webhook/Jenkinsfile'],
      ]
      def githubOwner = 'atakang7'
      def githubRepository = 'lab'

      def githubMultibranch = { String name, String jenkinsfile ->
        multibranchPipelineJob(name) {
          branchSources {
            branchSource {
              source {
                github {
                  id(name)
                  repoOwner(githubOwner)
                  repository(githubRepository)
                  repositoryUrl("https://github.com/${githubOwner}/${githubRepository}")
                  configuredByUrl(true)
                  credentialsId('github-creds')
                  traits {
                    gitHubBranchDiscovery { strategyId(1) }          // branches that are not pull requests
                    gitHubPullRequestDiscovery { strategyId(1) }     // pull requests from this repository, merged with their target
                    // Build main and pull requests only: other branches reach CI
                    // through their pull request.
                    headWildcardFilter {
                      includes('main PR-*')
                      excludes('')
                    }
                  }
                }
              }
            }
          }
          factory { workflowBranchProjectFactory { scriptPath(jenkinsfile) } }
          // Jenkins is not reachable from GitHub, so branches are re-indexed instead of webhooks.
          triggers { periodicFolderTrigger { interval('1m') } }
          orphanedItemStrategy { discardOldItems { numToKeep(10) } }
        }
      }

      services.each { service -> githubMultibranch(service.name, service.jenkinsfile) }
      githubMultibranch('platform', 'delivery/Jenkinsfile.platform')

      // Releases every environment to its state/<name>.yaml (environments.yaml).
      githubMultibranch('deploy', 'delivery/Jenkinsfile.deploy')

unclassified:
  # The platform delivery library (delivery/pipeline). Services cannot choose
  # another version: the platform decides what runs in every pipeline.
  globalLibraries:
    libraries:
      - name: lab-delivery
        defaultVersion: main
        implicit: false
        allowVersionOverride: false
        retriever:
          modernSCM:
            libraryPath: delivery/pipeline/
            scm:
              git:
                remote: https://github.com/atakang7/k8s-platform-lab.git
                credentialsId: github-creds
  location:
    url: https://jenkins.lab.test/
