credentials:
  system:
    domainCredentials:
      - credentials:
          - usernamePassword:
              scope: GLOBAL
              id: github-creds
              description: GitHub private repository credential
              username: "${GITHUB_USERNAME}"
              password: "${GITHUB_TOKEN}"
          - usernamePassword:
              scope: GLOBAL
              id: dockerhub-creds
              description: DockerHub CI credential
              username: "${DOCKERHUB_USERNAME}"
              password: "${DOCKERHUB_TOKEN}"
          # Delivery image signing key (cosign); its public half ships in the
          # delivery library as cosign.pub.
          - string:
              scope: GLOBAL
              id: cosign-private-key
              description: Delivery image signing key
              secret: "${COSIGN_PRIVATE_KEY}"
          - string:
              scope: GLOBAL
              id: cosign-password
              description: Delivery image signing key password
              secret: "${COSIGN_PASSWORD}"
