apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: jenkins-admin
  namespace: jenkins
spec:
  vaultAuthRef: jenkins
  mount: secret
  type: kv-v2
  path: jenkins/admin
  refreshAfter: 1m
  destination:
    create: true
    name: jenkins-admin
    transformation:
      excludeRaw: true
      includes: ['^jenkins-admin-(user|password)$']
  rolloutRestartTargets:
    # The controller is a StatefulSet; it reads these Secrets only at start.
    - kind: StatefulSet
      name: jenkins
