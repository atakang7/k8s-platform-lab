apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: dockerhub-creds
  namespace: jenkins
spec:
  vaultAuthRef: jenkins
  mount: secret
  type: kv-v2
  path: ci/dockerhub
  refreshAfter: 1m
  destination:
    create: true
    name: dockerhub-creds
    transformation:
      excludeRaw: true
      includes: ['^(username|token)$']
  rolloutRestartTargets:
    # The controller is a StatefulSet; it reads these Secrets only at start.
    - kind: StatefulSet
      name: jenkins
---
