apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: dockerhub-creds
  namespace: jenkins
spec:
  vaultAuthRef: jenkins
  mount: secret
  type: kv-v2
  path: ci/dockerhub
  refreshAfter: 1m
  destination:
    create: true
    name: dockerhub-creds
    transformation:
      excludeRaw: true
      includes: ['^(username|token)$']
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: github-creds
  namespace: jenkins
spec:
  vaultAuthRef: jenkins
  mount: secret
  type: kv-v2
  path: ci/github
  refreshAfter: 1m
  destination:
    create: true
    name: github-creds
    transformation:
      excludeRaw: true
      includes: ['^(username|token)$']
