apiVersion: v1
kind: Namespace
metadata:
  name: stage3-validation
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: stage3-validation
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stage3-backend
  template:
    metadata:
      labels:
        app: stage3-backend
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: http
          image: hashicorp/http-echo@sha256:fcb75f691c8b0414d670ae570240cbf95502cc18a9ba57e982ecac589760a186
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          args: ["-listen=:5678", "-text=stage3-edge-ok"]
          ports:
            - containerPort: 5678
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: stage3-validation
spec:
  selector:
    app: stage3-backend
  ports:
    - port: 80
      targetPort: 5678
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: backend
  namespace: stage3-validation
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - stage3.lab.test
  rules:
    - host: stage3.lab.test
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 80
