apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: rfc2136-tsig
  namespace: external-dns
spec:
  vaultAuthRef: dns
  mount: secret
  type: kv-v2
  path: edge/dns/tsig
  refreshAfter: 1m
  destination:
    create: true
    name: rfc2136-tsig
    transformation:
      excludeRaw: true
      includes: ['^(key_name|secret)$']
  rolloutRestartTargets:
    - kind: Deployment
      name: external-dns
