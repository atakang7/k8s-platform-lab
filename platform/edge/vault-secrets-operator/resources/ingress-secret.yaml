apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: lab-wildcard
  namespace: ingress-nginx
spec:
  vaultAuthRef: tls
  mount: secret
  type: kv-v2
  path: edge/tls/wildcard
  refreshAfter: 1m
  destination:
    create: true
    name: lab-wildcard
    type: kubernetes.io/tls
    transformation:
      excludeRaw: true
      includes: ['^tls\.(crt|key)$']
  rolloutRestartTargets:
    - kind: Deployment
      name: ingress-nginx-controller
