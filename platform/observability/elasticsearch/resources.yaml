apiVersion: v1
kind: Service
metadata:
  name: logs-es-http
  namespace: observability
spec:
  selector:
    app: logs-es
  ports:
    - name: http
      port: 9200
      targetPort: http
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: logs-es
  namespace: observability
spec:
  serviceName: logs-es-http
  replicas: 1
  selector:
    matchLabels:
      app: logs-es
  template:
    metadata:
      labels:
        app: logs-es
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      nodeSelector:
        kubernetes.io/hostname: node-2
      securityContext:
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: elasticsearch
          image: docker.elastic.co/elasticsearch/elasticsearch:8.19.9
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          args:
            - elasticsearch
            - -Ediscovery.type=single-node
            - -Expack.security.enabled=false
            - -Expack.ml.enabled=false
            - -Enode.store.allow_mmap=false
          env:
            - name: ES_JAVA_OPTS
              value: -Xms256m -Xmx256m
          ports:
            - name: http
              containerPort: 9200
          # Keep first-install scheduling deterministic on the 2 GiB node-2
          # while retaining enough runtime headroom above the 256 MiB JVM heap.
          resources:
            requests: {cpu: 100m, memory: 384Mi}
            limits: {cpu: 750m, memory: 768Mi}
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /_cluster/health
              port: http
            periodSeconds: 10
          volumeMounts:
            - name: elasticsearch-data
              mountPath: /usr/share/elasticsearch/data
  volumeClaimTemplates:
    - metadata:
        name: elasticsearch-data
      spec:
        storageClassName: local-path
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 4Gi
